<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#191a18"><title>午夜打字机 · Midnight Capsule</title><meta name="description" content="一台有温度的午夜打字机。写下文字，让微光、蛛网与机械声跟随指尖。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1c19'/%3E%3Cpath d='M8 9h16M16 9v15M10 24h12' fill='none' stroke='%23e8d5a6' stroke-width='3'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="refinement.css">
</head>
<body>
<main class="machine" aria-label="午夜打字机">
 <header class="topbar"><div class="brand"><span class="brand-eyebrow">THE QUIET HOURS</span><h1>Midnight Capsule<span class="brand-dot">.</span></h1><span class="brand-caption">把时间放慢，把心事写下来。</span></div><div class="top-right"><span id="count">0 / 3 000</span><button id="reset" class="icon" aria-label="换一张白纸" title="换一张白纸"><svg viewBox="0 0 24 24"><path d="M9 5 3 11l6 6M3 11h11a6 6 0 0 1 6 6"/></svg></button><button id="save" class="icon" aria-label="下载文字" title="下载文字"><svg viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4M5 11H3v10h18V11h-2"/></svg></button></div></header>
 <section class="stage" aria-label="打字纸，点击开始输入"><span class="paper-label" aria-hidden="true">No. 01 <span>A MOMENT TO YOURSELF</span></span><canvas id="scene" aria-hidden="true"></canvas><textarea id="input" aria-label="在打字机上输入文字" maxlength="3000" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" inputmode="none"></textarea><button id="prompt" class="first-line">Need a first line? <span aria-hidden="true">↗</span></button><p id="hint" class="hint">轻触纸张，让故事开始</p></section>
 <section class="controls" aria-label="灯光设置">
  <label><span>LIGHT <output id="lightValue">Low</output></span><input id="light" aria-label="灯光亮度" type="range" min="0" max="100" value="12"></label>
  <label><span>SPREAD <output id="spreadValue">144°</output></span><input id="spread" aria-label="灯光范围" type="range" min="70" max="170" value="144"></label>
  <label><span>REACH <output id="reachValue">210%</output></span><input id="reach" aria-label="灯光距离" type="range" min="80" max="250" value="210"></label>
  <button id="theme" class="icon sun" aria-label="切换到白昼模式" title="切换明暗">☀</button>
 </section>
 <section class="keyboard" aria-label="屏幕键盘">
  <div class="keyboard-top"><button id="sound" aria-label="关闭音效" title="音效开关"><svg viewBox="0 0 24 24"><path d="m11 5-5 4H2v6h4l5 4ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg><span id="soundLabel">声音已开启</span></button><span id="modeLabel">MIDNIGHT · 01</span><button id="native" aria-label="切换系统键盘" title="使用系统键盘输入中文">中文 / EN</button></div>
  <div id="keys"></div>
  <footer><span class="tiny-dot"></span><span id="status" role="status" aria-live="polite">写下你的第一句话</span><span class="keyboard-note">键盘也可以直接输入</span></footer>
 </section>
 <dialog id="confirm"><p>换一张白纸？</p><span>当前文字将被清空。</span><div><button id="cancelReset">继续写</button><button id="confirmReset">换纸</button></div></dialog>
</main>
<script src="app.js"></script>
</body></html>
